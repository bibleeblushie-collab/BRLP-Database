<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babe Ruth League ID Card Generator</title>
    <!-- Google Fonts: Poppins Bold -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-width: 3.375in;
            --card-height: 2.125in;
            --primary-bg: #0b1d3a;
            --accent-red: #c8102e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .controls-section h2 {
            font-size: 1.25rem;
            color: #0b1d3a;
            border-bottom: 2px solid #e4e6eb;
            padding-bottom: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b4f56;
        }

        input[type="text"], select, input[type="file"] {
            padding: 0.6rem 0.8rem;
            border: 1px solid #ccd0d5;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.2);
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 1.5rem;
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        /* ID Card Original Standard Size: CR80 (3.375" x 2.125") */
        .id-card-wrapper {
            perspective: 1000px;
        }

        .id-card {
            width: 3.375in;
            height: 2.125in;
            background: linear-gradient(135deg, #0b1d3a 0%, #1e3a8a 100%);
            border-radius: 0.125in;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
            padding: 0.15in;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
        }

        /* Red Accent Bar at Top */
        .id-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 0.08in;
            background: #c8102e;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.05in;
        }

        .logo-container {
            width: 0.6in;
            height: 0.45in;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .charter-text {
            font-size: 7.5pt;
            font-weight: 700;
            color: #ffffff;
            text-align: right;
            line-height: 1.1;
            text-transform: uppercase;
            /* Explicitly ensuring no background highlight or shadow */
            background: transparent !important;
            text-shadow: none !important;
        }

        .card-body {
            display: flex;
            gap: 0.12in;
            align-items: center;
            margin-top: 0.05in;
        }

        .photo-box {
            width: 0.65in;
            height: 0.8in;
            background-color: #ffffff;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .details-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.02in;
            overflow: hidden;
        }

        /* Strictly white Poppins bold text, no highlighting */
        .card-text {
            color: #ffffff !important;
            font-family: 'Poppins', sans-serif !important;
            font-weight: 700 !important;
            background: transparent !important;
            background-color: transparent !important;
            text-shadow: none !important;
            margin: 0;
            padding: 0;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .name-text {
            font-size: 9.5pt;
            letter-spacing: -0.2px;
        }

        .role-text {
            font-size: 7.5pt;
            opacity: 0.95;
            text-transform: uppercase;
        }

        .division-text {
            font-size: 7pt;
            opacity: 0.9;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 0.03in;
        }

        .id-number {
            font-size: 6pt;
            font-weight: 700;
            color: #ffffff !important;
            background: transparent !important;
        }

        .league-title {
            font-size: 6pt;
            font-weight: 700;
            color: #ffffff !important;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: transparent !important;
        }

        .print-btn {
            background-color: #0b1d3a;
            color: white;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .print-btn:hover {
            background-color: #1e3a8a;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .id-card, .id-card * {
                visibility: visible;
            }
            .id-card {
                position: absolute;
                left: 0;
                top: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Controls Section -->
        <div class="controls-section">
            <h2>Babe Ruth League ID Settings</h2>

            <div class="form-group">
                <label for="logoInput">Upload Babe Ruth League Logo</label>
                <input type="file" id="logoInput" accept="image/*">
            </div>

            <div class="form-group">
                <label for="photoInput">Upload ID Photo</label>
                <input type="file" id="photoInput" accept="image/*">
            </div>

            <div class="form-group">
                <label for="nameInput">Full Name</label>
                <input type="text" id="nameInput" value="JOHN SMITH" placeholder="Enter Full Name">
            </div>

            <div class="form-group">
                <label for="roleInput">Role</label>
                <input type="text" id="roleInput" value="COACH / MANAGER" placeholder="e.g. HEAD COACH, PLAYER">
            </div>

            <div class="form-group">
                <label for="divisionSelect">Age Division Control</label>
                <select id="divisionSelect">
                    <option value="Cal Ripken (8U)">Cal Ripken (8U)</option>
                    <option value="Cal Ripken (10U)">Cal Ripken (10U)</option>
                    <option value="Cal Ripken (12U)" selected>Cal Ripken (12U)</option>
                    <option value="Babe Ruth (13-15)">Babe Ruth (13-15)</option>
                    <option value="Babe Ruth (16-18)">Babe Ruth (16-18)</option>
                    <option value="Softball 10U">Softball 10U</option>
                    <option value="Softball 12U">Softball 12U</option>
                    <option value="Softball 14U">Softball 14U</option>
                    <option value="Custom">Custom Division...</option>
                </select>
            </div>

            <div class="form-group" id="customDivisionGroup" style="display: none;">
                <label for="customDivisionInput">Custom Age Division</label>
                <input type="text" id="customDivisionInput" placeholder="Enter Custom Division">
            </div>

            <div class="form-group">
                <label for="charterInput">Charter / League Name</label>
                <input type="text" id="charterInput" value="WESTSIDE BABE RUTH LEAGUE" placeholder="Enter Charter Name">
            </div>

            <div class="form-group">
                <label for="idNumInput">ID Number</label>
                <input type="text" id="idNumInput" value="BRL-2026-9842" placeholder="ID Number">
            </div>
        </div>

        <!-- ID Card Preview Section -->
        <div class="preview-section">
            <h2 style="font-size: 1.1rem; color: #0b1d3a;">ID Template Preview (Original CR80 Size)</h2>
            
            <div class="id-card-wrapper">
                <div class="id-card" id="idCard">
                    <!-- Top Header -->
                    <div class="card-header">
                        <div class="logo-container">
                            <img id="cardLogo" src="https://via.placeholder.com/120x90/ffffff/0b1d3a?text=BRL+LOGO" alt="Babe Ruth League Logo">
                        </div>
                        <div class="charter-text card-text" id="displayCharter">WESTSIDE BABE RUTH LEAGUE</div>
                    </div>

                    <!-- Card Body -->
                    <div class="card-body">
                        <div class="photo-box">
                            <img id="cardPhoto" src="https://via.placeholder.com/120x150/e0e0e0/666666?text=PHOTO" alt="Member Photo">
                        </div>
                        <div class="details-box">
                            <div class="card-text name-text" id="displayName">JOHN SMITH</div>
                            <div class="card-text role-text" id="displayRole">COACH / MANAGER</div>
                            <div class="card-text division-text" id="displayDivision">Cal Ripken (12U)</div>
                        </div>
                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer">
                        <div class="card-text id-number" id="displayIdNum">ID: BRL-2026-9842</div>
                        <div class="card-text league-title">BABE RUTH LEAGUE</div>
                    </div>
                </div>
            </div>

            <button class="print-btn" onclick="window.print()">Print / Export ID</button>
        </div>
    </div>

    <script>
        // Inputs & Preview Elements
        const logoInput = document.getElementById('logoInput');
        const photoInput = document.getElementById('photoInput');
        const nameInput = document.getElementById('nameInput');
        const roleInput = document.getElementById('roleInput');
        const divisionSelect = document.getElementById('divisionSelect');
        const customDivisionGroup = document.getElementById('customDivisionGroup');
        const customDivisionInput = document.getElementById('customDivisionInput');
        const charterInput = document.getElementById('charterInput');
        const idNumInput = document.getElementById('idNumInput');

        const cardLogo = document.getElementById('cardLogo');
        const cardPhoto = document.getElementById('cardPhoto');
        const displayName = document.getElementById('displayName');
        const displayRole = document.getElementById('displayRole');
        const displayDivision = document.getElementById('displayDivision');
        const displayCharter = document.getElementById('displayCharter');
        const displayIdNum = document.getElementById('displayIdNum');

        // Logo Image Handler
        logoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    cardLogo.src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Photo Image Handler
        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    cardPhoto.src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Text Inputs Handlers
        nameInput.addEventListener('input', () => {
            displayName.textContent = nameInput.value.toUpperCase() || 'NAME';
        });

        roleInput.addEventListener('input', () => {
            displayRole.textContent = roleInput.value.toUpperCase() || 'ROLE';
        });

        charterInput.addEventListener('input', () => {
            displayCharter.textContent = charterInput.value.toUpperCase() || 'CHARTER';
        });

        idNumInput.addEventListener('input', () => {
            displayIdNum.textContent = 'ID: ' + (idNumInput.value.toUpperCase() || '');
        });

        // Division Control Handler
        divisionSelect.addEventListener('change', () => {
            if (divisionSelect.value === 'Custom') {
                customDivisionGroup.style.display = 'flex';
                displayDivision.textContent = customDivisionInput.value || 'CUSTOM DIVISION';
            } else {
                customDivisionGroup.style.display = 'none';
                displayDivision.textContent = divisionSelect.value;
            }
        });

        customDivisionInput.addEventListener('input', () => {
            if (divisionSelect.value === 'Custom') {
                displayDivision.textContent = customDivisionInput.value.toUpperCase() || 'CUSTOM DIVISION';
            }
        });
    </script>
</body>
</html>
